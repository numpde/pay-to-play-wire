[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-invoice"
version = "0.1.2"
description = "Strict exact-byte merchant invoices and Ed25519 envelopes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signed_invoice = ["vectors/*.json"]
