[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wire"
version = "0.6.0"
description = "PayToPlay invoice JWS and EIP-712 voucher wire artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.2", "pydantic==2.13.4", "eth-account==0.14.0", "eth-keys==0.8.0", "eth-utils==6.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wire = ["vectors/*.json"]
